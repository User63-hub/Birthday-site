<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پارتی تولد</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#071426;color:#fff;font-family:Tahoma,"Segoe UI",sans-serif;overflow-x:hidden}
.page{min-height:190vh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 4%,rgba(100,190,240,.15),transparent 20%),#071426}
.page.party{background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.18),transparent 22%),radial-gradient(circle at 12% 45%,rgba(50,160,230,.16),transparent 28%),radial-gradient(circle at 88% 48%,rgba(220,90,190,.14),transparent 28%),#071426}
.top{min-height:88vh;padding:25px 5vw 40px;text-align:center;position:relative;z-index:5}
h1{margin:0 0 12px;font-size:clamp(16px,3.5vw,24px);font-weight:500;line-height:1.8;text-shadow:0 0 16px rgba(120,210,255,.4)}
.disco-wrap{width:120px;height:120px;margin:0 auto 14px;position:relative}
.disco{position:absolute;top:0;left:50%;width:66px;height:66px;transform:translateX(-50%);border-radius:50%;background:repeating-conic-gradient(#fff 0 9deg,#a8bbc8 9deg 18deg);box-shadow:0 0 14px #fff,0 0 34px rgba(80,190,255,.8),0 0 60px rgba(100,130,255,.4);animation:spin 6s linear infinite}
.disco:before{content:"";position:absolute;inset:-27px;border-radius:50%;background:conic-gradient(transparent 0 30deg,rgba(80,200,255,.25) 30deg 50deg,transparent 50deg 100deg,rgba(245,100,220,.2) 100deg 120deg,transparent 120deg 220deg,rgba(255,220,100,.18) 220deg 245deg,transparent 245deg);filter:blur(5px);z-index:-1}
.disco:after{content:"";position:absolute;left:50%;top:-90px;width:3px;height:90px;transform:translateX(-50%);background:linear-gradient(#c5eeff,transparent);box-shadow:0 0 10px #b9e8ff}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.beams{position:absolute;inset:0;pointer-events:none}
.beam{position:absolute;top:0;width:3px;height:60vh;opacity:.16;transform-origin:top;animation:sway 4s ease-in-out infinite alternate}
.beam:nth-child(1){left:22%;transform:rotate(-20deg);background:linear-gradient(#5bc9ff,transparent)}
.beam:nth-child(2){left:43%;transform:rotate(-7deg);background:linear-gradient(#fff,transparent)}
.beam:nth-child(3){left:58%;transform:rotate(8deg);background:linear-gradient(#f08cff,transparent)}
.beam:nth-child(4){left:78%;transform:rotate(20deg);background:linear-gradient(#67ddff,transparent)}
@keyframes sway{to{opacity:.34}}
.start,.next{border:0;border-radius:999px;padding:13px 27px;cursor:pointer;font:600 14px Tahoma}
.start{color:#fff;background:#416f88;box-shadow:0 8px 25px rgba(70,170,220,.3);transition:.3s}
.start.hide{opacity:0;pointer-events:none}
.scroll-hint{display:none;margin-top:12vh;font-size:clamp(14px,3vw,18px);line-height:2.1}
.party .scroll-hint{display:block}
.down{font-size:28px;margin-top:8px;animation:down 1s ease-in-out infinite alternate}
@keyframes down{to{transform:translateY(8px)}}
.party-area{min-height:105vh;padding:7vh 5vw 13vh;display:none;position:relative;z-index:5;text-align:center;align-items:center;flex-direction:column}
.party .party-area{display:flex}
.party-icons{font-size:clamp(28px,7vw,46px);margin-bottom:22px;display:flex;gap:18px}
.prompt{font-size:clamp(15px,3vw,20px);line-height:2;margin:0}
.egg{width:150px;height:180px;margin:28px auto;position:relative;cursor:pointer}
.shell{position:absolute;inset:0;border-radius:52% 48% 48% 52%/58% 55% 45% 42%;background:linear-gradient(135deg,#fffdf6,#e9ddca);border:2px solid #d5c5aa;transition:.7s}
.crack{position:absolute;left:50%;top:50%;width:90%;height:3px;transform:translate(-50%,-50%);background:#87715a;opacity:0;z-index:2}
.egg.b1 .crack{opacity:1}
.egg.b2 .shell{clip-path:polygon(0 0,100% 0,100% 48%,78% 54%,60% 47%,42% 56%,24% 49%,0 55%)}
.egg.b2 .crack{opacity:1}
.chick{display:none;position:absolute;z-index:3;left:50%;top:16%;transform:translateX(-50%);font-size:78px}
.egg.b3 .shell{clip-path:polygon(0 0,100% 0,100% 38%,82% 45%,67% 38%,53% 49%,37% 40%,20% 48%,0 41%);transform:translateY(5px)}
.egg.b3 .chick{display:block}
.dance{animation:dance 2.15s ease-in-out infinite}
@keyframes dance{
0%{transform:translateX(-50%) translate(0,0) rotate(-3deg)}
18%{transform:translateX(-50%) translate(-12px,-2px) rotate(3deg)}
36%{transform:translateX(-50%) translate(-20px,-9px) rotate(-2deg)}
50%{transform:translateX(-50%) translate(-8px,-14px) rotate(3deg)}
66%{transform:translateX(-50%) translate(12px,-3px) rotate(-3deg)}
82%{transform:translateX(-50%) translate(20px,-8px) rotate(2deg)}
100%{transform:translateX(-50%) translate(0,0) rotate(-3deg)}
}
.message{display:none;margin:0 auto 35px;font-size:clamp(14px,3vw,19px);line-height:2;text-shadow:0 0 14px rgba(255,255,255,.25)}
.message.show{display:block;animation:fade .7s both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.next{margin-top:9vh;background:#fff;color:#315b73;box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative;z-index:20}
.streamer{position:absolute;top:-45px;width:5px;height:28px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(620deg)}}
.balloon{position:fixed;bottom:-70px;font-size:48px;z-index:11;animation:rise 8s linear infinite;pointer-events:none}
@keyframes rise{to{bottom:110vh;transform:translateX(var(--drift)) rotate(8deg)}}
</style>
</head>
<body>
<main class="page" id="page">
<div class="beams"><i class="beam"></i><i class="beam"></i><i class="beam"></i><i class="beam"></i></div>
<div id="streamers"></div>
<div class="balloon" style="left:8%;--drift:35px;animation-delay:.2s">🎈</div>
<div class="balloon" style="left:30%;--drift:-45px;animation-delay:1.1s">🎈</div>
<div class="balloon" style="left:72%;--drift:45px;animation-delay:.6s">🎈</div>
<div class="balloon" style="left:90%;--drift:-25px;animation-delay:1.8s">🎈</div>
<section class="top">
<h1>حالا دیگه وقت جشن گرفتنهههه!🎊🎈✨️</h1>
<div class="disco-wrap"><div class="disco"></div></div>
<button type="button" class="start" id="start">بزن بریم پارتی!</button>
<div class="scroll-hint" id="hint">یه چیزی کمه،پارتی بدون خود جوجو نمیشه که!<br>صفحه رو بکش پایین<div class="down">↓</div></div>
</section>
<section class="party-area">
<div class="party-icons">🎉 ✨️ 🎊 🪩</div>
<p class="prompt">تخم رو بشکن!</p>
<div class="egg" id="egg" tabindex="0" role="button" aria-label="تخم رو بشکن">
<div class="shell"></div><div class="crack"></div><div class="chick" id="chick">🐣</div>
</div>
<div class="message" id="message">جوجوی نازم ۲۱ امین سالگرد از تخم درومدنت مبارک🥹🐣✨️</div>
<button type="button" class="next" id="next">صفحه بعد؛ منتظرتم، بعد از پارتی بیا</button>
</section>
</main>

<script>
(function(){
"use strict";
var page=document.getElementById("page");
var start=document.getElementById("start");
var music=document.getElementById("music");
var egg=document.getElementById("egg");
var chick=document.getElementById("chick");
var message=document.getElementById("message");
var streamers=document.getElementById("streamers");

function makeStreamers(){
var colors=["#65c8ff","#f58adf","#ffd66e","#ffffff","#8fe3c2","#8c9cff"];
for(var i=0;i<100;i++){
var s=document.createElement("i");
s.className="streamer";
s.style.left=(Math.random()*100)+"%";
s.style.background=colors[Math.floor(Math.random()*colors.length)];
s.style.setProperty("--drift",(Math.random()*260-130)+"px");
s.style.animationDuration=(3.5+Math.random()*4.5)+"s";
s.style.animationDelay=(-Math.random()*7)+"s";
streamers.appendChild(s);
}
}
start.addEventListener("click",function(){
page.classList.add("party");
start.classList.add("hide");
makeStreamers();

/* Start the music immediately from the same user click.
   Browsers allow audio here because this code runs directly inside
   the click handler for "بزن بریم پارتی!". The audio is embedded in
   this HTML, so no separate MP3 file is required. */
music.muted = false;
music.volume = 1;
music.loop = true;
var startMusic = music.play();
if(startMusic && startMusic.catch){
  startMusic.catch(function(err){
    console.warn("Music could not start:", err);
  });
}

setTimeout(function(){
document.getElementById("hint").scrollIntoView({behavior:"smooth",block:"center"});
},250);
});

var clicks=0;
function breakEgg(){
if(!page.classList.contains("party")||clicks>=3){return;}
clicks++;
egg.classList.add("b"+clicks);

if(clicks===3){
  chick.classList.add("dance");
  message.classList.add("show");


}
}
egg.addEventListener("click",breakEgg);
egg.addEventListener("keydown",function(e){
if(e.key==="Enter"||e.key===" "){e.preventDefault();breakEgg();}
});
document.getElementById("next").addEventListener("click",function(){window.location.href="cake.html";});
})();
</script>
</body>
