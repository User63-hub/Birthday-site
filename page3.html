<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>یازده ستاره</title>
<style>
  :root{
    --night-1:#04050d;
    --night-2:#0a0e22;
    --night-3:#12173a;
    --glow-warm:#ffe3a8;
    --glow-warm-2:#ffb677;
    --star-color:#fff7e0;
    --text-soft:#cfd2e8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:var(--night-1);
    overflow:hidden;
    font-family:"Vazirmatn","Tahoma",sans-serif;
  }
  .sky{
    position:relative;
    width:100%;height:100dvh;min-height:100vh;
    overflow:hidden;
    background:
      radial-gradient(120% 70% at 50% 0%, var(--night-3) 0%, var(--night-2) 45%, var(--night-1) 100%);
    transition: background-color 1.3s ease, filter 1.3s ease;
  }
  .sky::before{
    /* هاله‌ی روشنایی که موقع باز شدن ستاره کل صفحه رو فرامی‌گیرد */
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(140% 140% at var(--gx,50%) var(--gy,50%),
      rgba(255,235,190,0.5) 0%,
      rgba(255,214,150,0.32) 25%,
      rgba(255,198,130,0.15) 50%,
      rgba(255,198,130,0.04) 75%,
      rgba(255,198,130,0) 100%);
    opacity:0;
    transition: opacity 1.4s ease;
    pointer-events:none;
    z-index:2;
  }
  .sky.dim::before{ opacity:0; }
  .sky.bright::before{ opacity:1; }
  .sky.bright{
    background:
      radial-gradient(120% 70% at 50% 0%, #2a3268 0%, #1b214c 45%, #10143a 100%);
    filter:brightness(1.08);
  }
  .sky.pre-dim{ filter:brightness(0.82); }

  /* ستاره‌های ریز تزئینی پس‌زمینه */
  .bg-star{
    position:absolute;
    border-radius:50%;
    background:var(--star-color);
    opacity:.5;
    animation:twinkle-bg linear infinite;
    pointer-events:none;
    z-index:1;
  }
  @keyframes twinkle-bg{
    0%,100%{opacity:.15;}
    50%{opacity:.85;}
  }

  .hero{
    position:relative;z-index:3;
    text-align:center;
    padding:5.5vh 7vw 0;
  }
  .hero p{
    margin:0 auto;
    max-width:480px;
    color:var(--text-soft);
    font-size:clamp(.92rem,3.4vw,1.08rem);
    line-height:2;
    text-shadow:0 0 18px rgba(180,190,255,.25);
  }

  .stars-layer{
    position:absolute;
    inset:0;
    z-index:4;
  }

  .star-btn{
    position:absolute;
    transform:translate(-50%,-50%);
    background:none;border:none;padding:16px;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    z-index:4;
  }
  .star-btn .glyph{
    display:block;
    width:26px;height:26px;
    background:linear-gradient(150deg,#fff3c4 0%,#ffd36b 55%,#f3a93e 100%);
    clip-path:polygon(50% 0%,63% 38%,100% 38%,70% 60%,82% 100%,50% 76%,18% 100%,30% 60%,0% 38%,37% 38%);
    filter:drop-shadow(0 0 8px rgba(255,211,107,.95)) drop-shadow(0 0 18px rgba(255,169,62,.65));
    animation:twinkle-main 3s ease-in-out infinite;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), filter .5s ease;
  }
  @keyframes twinkle-main{
    0%,100%{opacity:.8;}
    50%{opacity:1;}
  }
  .star-btn:hover .glyph{ transform:scale(1.25); }
  .star-btn.active .glyph{
    animation:none;
    transform:scale(3.2);
    filter:drop-shadow(0 0 22px rgba(255,243,196,1)) drop-shadow(0 0 46px rgba(255,169,62,.95));
  }

  .next-page{
    position:fixed;
    bottom:calc(16px + env(safe-area-inset-bottom, 0px));
    left:50%; transform:translateX(-50%);
    z-index:6;
    display:inline-flex;align-items:center;justify-content:center;
    white-space:nowrap;
    padding:9px 18px;
    color:var(--night-1);
    text-decoration:none;
    font-size:.82rem;font-weight:700;
    border-radius:999px;
    background:linear-gradient(135deg,var(--glow-warm),var(--glow-warm-2));
    box-shadow:0 0 16px rgba(255,198,130,.4);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .next-page:hover{
    transform:translateX(-50%) translateY(-3px);
    box-shadow:0 0 26px rgba(255,198,130,.6);
  }
  @media (max-width:400px){
    .next-page{ font-size:.76rem; padding:8px 15px; }
  }

  /* مودال عکس */
  .modal-overlay{
    position:fixed;inset:0;
    z-index:20;
    display:flex;align-items:center;justify-content:center;
    padding:6vh 6vw;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease;
  }
  .modal-overlay.open{
    opacity:1;pointer-events:auto;
  }
  .modal-card{
    position:relative;
    max-width:420px;width:100%;
    max-height:80vh;
    background:#0d1130;
    border:1px solid rgba(255,227,168,.25);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 0 60px rgba(255,198,130,.3), 0 20px 60px rgba(0,0,0,.6);
    transform:scale(.05) translate(var(--ox,0),var(--oy,0));
    opacity:0;
    transition:transform .6s cubic-bezier(.2,.85,.25,1), opacity .45s ease;
  }
  .modal-overlay.open .modal-card{
    transform:scale(1) translate(0,0);
    opacity:1;
  }
  .modal-card img{
    display:block;
    width:100%;height:100%;
    max-height:80vh;
    object-fit:contain;
    background:#050614;
  }
  .modal-close{
    position:fixed;
    top:3vh; left:5vw;
    z-index:25;
    width:40px;height:40px;
    border-radius:50%;
    border:1px solid rgba(255,247,224,.3);
    background:rgba(10,14,34,.7);
    backdrop-filter:blur(6px);
    color:var(--star-color);
    font-size:1.4rem;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    opacity:0;pointer-events:none;
    transition:opacity .4s ease;
  }
  .modal-overlay.open ~ .modal-close,
  .modal-close.show{
    opacity:1;pointer-events:auto;
  }

  @media (max-width:560px){
    .star-btn .glyph{width:22px;height:22px;}
  }
</style>
</head>
<body>

  <div class="sky" id="sky">
    <div class="hero">
      <p>میخوای بدونی چطوری زیباییت به شب های تاریک زندگی نور میتابونه؟<br>روی ستاره‌ها کلیک کن دونه دونه تا ببینی🙂✨️</p>
    </div>

    <div class="stars-layer" id="starsLayer"></div>

    <a href="letter.html" class="next-page">ادامه ماجراجویی💫</a>
  </div>

  <button class="modal-close" id="modalClose" aria-label="بستن">×</button>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
      <img id="modalImg" src="" alt="خاطره">
    </div>
  </div>

  // جابجایی تصادفی عکس‌ها (Fisher-Yates) تا هر بار رفرش، تخصیصشون شانسی باشه
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }
  var shuffledImages = shuffle(IMAGES.slice());

  // موقعیت ۱۱ ستاره‌ی اصلی، پخش‌شده در کل صفحه (بدون نیاز به اسکرول)
  var positions = [
    {x:12,y:24},{x:27,y:50},{x:45,y:29},{x:60,y:47},
    {x:76,y:25},{x:90,y:49},{x:16,y:66},{x:35,y:73},
    {x:56,y:68},{x:73,y:59},{x:86,y:75}
  ];

  var starsLayer = document.getElementById("starsLayer");
  var sky = document.getElementById("sky");
  var modalOverlay = document.getElementById("modalOverlay");
  var modalCard = document.getElementById("modalCard");
  var modalImg = document.getElementById("modalImg");
  var modalClose = document.getElementById("modalClose");

  positions.forEach(function(pos, idx){
    var btn = document.createElement("button");
    btn.className = "star-btn";
    btn.style.left = pos.x + "%";
    btn.style.top = pos.y + "%";
    btn.setAttribute("aria-label", "ستاره");
    var glyph = document.createElement("span");
    glyph.className = "glyph";
    btn.appendChild(glyph);
    btn.dataset.img = shuffledImages[idx];
    btn.addEventListener("click", function(e){ openStar(btn, e); });
    starsLayer.appendChild(btn);
  });

  // چند ستاره‌ی ریز تزئینی برای فضای رازآلود پس‌زمینه
  var bgFrag = document.createDocumentFragment();
  var BG_COUNT = 70;
  for(var i=0;i<BG_COUNT;i++){
    var s = document.createElement("div");
    s.className = "bg-star";
    var size = (Math.random()*2 + 1).toFixed(1);
    s.style.width = size+"px";
    s.style.height = size+"px";
    s.style.left = (Math.random()*100)+"%";
    s.style.top = (Math.random()*100)+"%";
    s.style.animationDuration = (2 + Math.random()*3).toFixed(2)+"s";
    s.style.animationDelay = (Math.random()*3).toFixed(2)+"s";
    bgFrag.appendChild(s);
  }
  starsLayer.appendChild(bgFrag);

  var activeBtn = null;

  function openStar(btn, e){
    if(activeBtn) return; // جلوگیری از باز شدن هم‌زمان چند ستاره
    activeBtn = btn;

    var rect = btn.getBoundingClientRect();
    var cx = rect.left + rect.width/2;
    var cy = rect.top + rect.height/2;
    var vw = window.innerWidth, vh = window.innerHeight;

    sky.style.setProperty("--gx", (cx/vw*100)+"%");
    sky.style.setProperty("--gy", (cy/vh*100)+"%");

    // مرحله ۱: آسمون کمی تیره‌تر می‌شود
    sky.classList.add("pre-dim");

    setTimeout(function(){
      // مرحله ۲: ستاره بزرگ و درخشان می‌شود + آسمون روشن می‌شود
      sky.classList.remove("pre-dim");
      sky.classList.add("bright");
      btn.classList.add("active");

      setTimeout(function(){
        // مرحله ۳: عکس از همون نقطه ظاهر می‌شود
        modalCard.style.setProperty("--ox", (cx - vw/2)+"px");
        modalCard.style.setProperty("--oy", (cy - vh/2)+"px");
        modalImg.src = btn.dataset.img;
        modalOverlay.classList.add("open");
        modalClose.classList.add("show");
      }, 420);
    }, 220);
  }

  function closeModal(){
    if(!activeBtn) return;
    modalOverlay.classList.remove("open");
    modalClose.classList.remove("show");

    setTimeout(function(){
      sky.classList.remove("bright");
      if(activeBtn){ activeBtn.classList.remove("active"); }
      activeBtn = null;
    }, 350);
  }

  modalClose.addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", function(e){
    if(e.target === modalOverlay) closeModal();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeModal();
  });
})();
</script>
